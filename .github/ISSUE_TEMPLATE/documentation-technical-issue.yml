name: Documentation / Technical Issue
description: Report a technical error, documentation problem, or other issue that requires review or correction.
title: "[Issue] "
labels: []
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Real-Time-Rendering-Lab에 대한 Technical Review와 Feedback에 감사드립니다.

        이 Form은 명확한 확인이나 수정이 필요한 문제를 기록하기 위한 공간입니다.

        일반적인 질문, 의견, 아이디어, Technical Discussion은 GitHub Discussions를 이용해 주세요.

  - type: dropdown
    id: issue_type
    attributes:
      label: Issue Type
      description: 가장 적절한 Issue Type을 선택해 주세요.
      options:
        - Technical Accuracy
        - Documentation
        - Terminology
        - Formula
        - Figure / Diagram
        - Unreal Engine Implementation
        - Broken Link / File Path
        - Typo
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: 문제가 발견된 Chapter, Section 또는 Document의 위치를 적어주세요.
      placeholder: "예: Chapter 06 / 6.4 Color Space / Chapter06_ModernRealTimeRendering.md"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: 문제가 있다고 생각되는 내용을 설명해 주세요.
      placeholder: |
        어떤 내용에서 문제가 발견되었는지 설명해 주세요.

        가능하다면 현재 문서의 내용과 문제가 있다고 판단한 이유를 함께 적어주세요.
    validations:
      required: true

  - type: textarea
    id: suggested_correction
    attributes:
      label: Suggested Correction
      description: 가능하다면 수정 방향이나 더 정확한 설명을 제안해 주세요.
      placeholder: |
        수정이 필요하다고 생각되는 내용이나 대체 설명을 작성해 주세요.

        확실하지 않은 경우 비워두어도 됩니다.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: 판단 근거가 되는 Reference가 있다면 남겨주세요.
      placeholder: |
        Documentation, Paper, Article, Unreal Engine Documentation 등의 Reference를 남겨주세요.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Screenshot이나 추가적인 Context가 있다면 첨부해 주세요.
      placeholder: |
        Screenshot, Rendering Result, Error Message 또는 추가 설명을 남겨주세요.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      description: Issue를 등록하기 전에 아래 내용을 확인해 주세요.
      options:
        - label: 기존 Issues에 동일하거나 유사한 내용이 등록되어 있는지 확인했습니다.
          required: true
        - label: 일반적인 질문이나 의견이 아니라 확인 또는 수정이 필요한 내용입니다.
          required: true
