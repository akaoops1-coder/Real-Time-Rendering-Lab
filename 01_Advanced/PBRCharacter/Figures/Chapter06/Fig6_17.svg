<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="736" viewBox="0 0 1440 736"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#566B82"/></marker></defs><rect width="1440" height="736" fill="#fff"/><text x="60" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F6BFF">PRODUCTION  /  DATA FLOW</text><text x="60" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#17283D">From material inputs to the V3 carrier</text><text x="60" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#4A5D72">The original PBR outputs and the temporary payload travel on separate wires.</text><path d="M60 178H1380" stroke="#D7E1EB" stroke-width="2"/><rect x="60" y="218" width="375" height="136" rx="15" fill="#F7FAFD" stroke="#C7D4E3" stroke-width="2"/><rect x="60" y="230" width="5" height="112" rx="2" fill="#2F6BFF"/><text x="80" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#2F6BFF">Surface textures</text><text x="80" y="291" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Base Color · ORM · Normals</text><text x="80" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Existing scalar / vector controls</text><rect x="534" y="218" width="375" height="136" rx="15" fill="#F7FAFD" stroke="#C7D4E3" stroke-width="2"/><rect x="534" y="230" width="5" height="112" rx="2" fill="#2F6BFF"/><text x="554" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#2F6BFF">Material surface</text><text x="554" y="291" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Use_DetailNormal → FlattenNormal</text><text x="554" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Base Color / ORM → PBR inputs</text><rect x="1005" y="218" width="375" height="136" rx="15" fill="#F7FAFD" stroke="#C7D4E3" stroke-width="2"/><rect x="1005" y="230" width="5" height="112" rx="2" fill="#297643"/><text x="1025" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#297643">Default Lit</text><text x="1025" y="291" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Surface normal and PBR attributes</text><text x="1025" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">feed regular shading.</text><path d="M 435 286 L 534 286" stroke="#566B82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 909 286 L 1005 286" stroke="#566B82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="60" y="459" width="375" height="161" rx="15" fill="#F7FAFD" stroke="#C7D4E3" stroke-width="2"/><rect x="60" y="471" width="5" height="137" rx="2" fill="#2F6BFF"/><text x="80" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#2F6BFF">Skin data</text><text x="80" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Regions RGB · AO · FaceMask A</text><text x="80" y="563" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Penner LUT · tuning values</text><text x="80" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Geometry / surface N · key L</text><rect x="534" y="459" width="375" height="161" rx="15" fill="#F7FAFD" stroke="#C7D4E3" stroke-width="2"/><rect x="534" y="471" width="5" height="137" rx="2" fill="#2F6BFF"/><text x="554" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#2F6BFF">Custom residual</text><text x="554" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Bright diffuse · Penner · transmission</text><text x="554" y="563" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Clamp signed RGB to ±0.35</text><text x="554" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Encode R in tag around −9</text><rect x="1005" y="459" width="375" height="161" rx="15" fill="#F7FAFD" stroke="#C7D4E3" stroke-width="2"/><rect x="1005" y="471" width="5" height="137" rx="2" fill="#A85606"/><text x="1025" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#A85606">Custom output</text><text x="1025" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">ClearCoatBottomNormal</text><text x="1025" y="563" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">V3 checks tag and decodes RGB</text><text x="1025" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">in the Mobile Base Pass.</text><path d="M 435 537 L 534 537" stroke="#566B82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 909 537 L 1005 537" stroke="#566B82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><polyline points="721,354 721,459" stroke="#566B82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="60" y="687" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#4A5D72">The lower wire uses the R&amp;D carrier in the saved Production Material.</text></svg>