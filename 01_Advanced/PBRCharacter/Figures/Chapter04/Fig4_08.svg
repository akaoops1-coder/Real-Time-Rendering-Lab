<text x="277.0" y="790.64" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#43A047" text-anchor="start">p -&gt; P</text>
<polyline points="482.0,850 482.0,530.0" fill="none" stroke="#2F6BFF" stroke-width="2" stroke-linejoin="round" stroke-dasharray="10 8"/>
<circle cx="482.0" cy="530.0" r="7" fill="#2F6BFF" stroke="#2F6BFF" stroke-width="1"/>
<text x="497.0" y="580.64" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2F6BFF" text-anchor="start">i -&gt; I</text>
<polyline points="730.0,850 730.0,250.0" fill="none" stroke="#FB8C00" stroke-width="2" stroke-linejoin="round" stroke-dasharray="10 8"/>
<circle cx="730.0" cy="250.0" r="7" fill="#FB8C00" stroke="#FB8C00" stroke-width="1"/>
<text x="745.0" y="234.64" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#FB8C00" text-anchor="start">O -&gt; O</text>
<text x="180" y="243.92" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#7B858A" text-anchor="start">Identity: SourceRadius = r</text>
<rect x="870" y="190" width="850" height="205" rx="12" fill="white" stroke="#43A047" stroke-width="3"/>
<text x="900" y="234.94" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#43A047" text-anchor="start">1  |  PUPIL</text>
<text x="900" y="282.64" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#263238" text-anchor="start">tPupil = r / p</text>
<text x="900" y="321.64" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#263238" text-anchor="start">PupilSourceRadius = Lerp(0, P, tPupil)</text>
<text x="900" y="360.64" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#263238" text-anchor="start">Audited equivalent: r x (P / p)</text>
<rect x="870" y="415" width="850" height="205" rx="12" fill="white" stroke="#2F6BFF" stroke-width="3"/>
<text x="900" y="459.94" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#2F6BFF" text-anchor="start">2  |  IRIS RING</text>
<text x="900" y="507.64" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#263238" text-anchor="start">tIris = Saturate((r - p) / Max(i - p, epsilon))</text>
<text x="900" y="546.64" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#263238" text-anchor="start">IrisSourceRadius = Lerp(P, I, tIris)</text>
<text x="900" y="585.64" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#263238" text-anchor="start">r = p gives P; r = i gives I</text>
<rect x="870" y="640" width="850" height="205" rx="12" fill="white" stroke="#FB8C00" stroke-width="3"/>
<text x="900" y="684.94" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#FB8C00" text-anchor="start">3  |  OUTER TRANSITION</text>
<text x="900" y="732.64" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#263238" text-anchor="start">tOuter = Saturate((r - i) / Max(O - i, epsilon))</text>
<text x="900" y="771.64" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#263238" text-anchor="start">OuterSourceRadius = r + (I - i) x (1 - tOuter)</text>
<text x="900" y="810.64" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#263238" text-anchor="start">r = i gives I; r &gt;= O returns original r</text>
<rect x="70" y="985" width="1650" height="85" rx="12" fill="#EEF3F7" stroke="#EEF3F7" stroke-width="2"/>
<text x="100" y="1020.64" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#263238" text-anchor="start">Input contract: 0 &lt; p &lt; i &lt; O. Continuity is value continuity; slopes can change at boundaries.</text>
<text x="100" y="1053.78" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#FB8C00" text-anchor="start">Audited graph: pupil denominator is unguarded; no radius-order clamp. Those protections remain open.</text>
</svg>