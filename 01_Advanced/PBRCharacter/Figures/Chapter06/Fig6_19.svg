<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="706" viewBox="0 0 1440 706"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#566B82"/></marker></defs><rect width="1440" height="706" fill="#fff"/><text x="60" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F6BFF">TEXTURE AUTHORING  /  CURVATUREV</text><text x="60" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#17283D">Paint a radius, then check the response</text><text x="60" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#4A5D72">Packed R stores CurvatureV, a logarithmic 1–100 mm radius coordinate.</text><path d="M60 178H1380" stroke="#D7E1EB" stroke-width="2"/><rect x="60" y="218" width="375" height="158" rx="15" fill="#F7FAFD" stroke="#C7D4E3" stroke-width="2"/><rect x="60" y="230" width="5" height="134" rx="2" fill="#2F6BFF"/><text x="80" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#2F6BFF">1  Set the geometry scale</text><text x="80" y="291" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Confirm world units and UV set.</text><text x="80" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Compare a known sphere / cylinder.</text><text x="80" y="353" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Use a smooth source surface.</text><rect x="532" y="218" width="375" height="158" rx="15" fill="#F7FAFD" stroke="#C7D4E3" stroke-width="2"/><rect x="532" y="230" width="5" height="134" rx="2" fill="#2F6BFF"/><text x="552" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#2F6BFF">2  Encode the radius</text><text x="552" y="291" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">V = saturate(log10(100 / Rmm) / 2)</text><text x="552" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">R: 1 mm → 10 mm → 100 mm</text><text x="552" y="353" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">V: 1.00 → 0.50 → 0.00</text><rect x="1005" y="218" width="375" height="158" rx="15" fill="#F7FAFD" stroke="#C7D4E3" stroke-width="2"/><rect x="1005" y="230" width="5" height="134" rx="2" fill="#2F6BFF"/><text x="1025" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#2F6BFF">3  Paint stable regions</text><text x="1025" y="291" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Nose, lip and cheek transitions</text><text x="1025" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Clean folds, seams and islands.</text><text x="1025" y="353" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Pad UV borders for lower mips.</text><path d="M 435 295 L 532 295" stroke="#566B82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 907 295 L 1005 295" stroke="#566B82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="60" y="469" width="635" height="145" rx="15" fill="#F7FAFD" stroke="#C7D4E3" stroke-width="2"/><rect x="60" y="481" width="5" height="121" rx="2" fill="#A85606"/><text x="80" y="506" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#A85606">4  Import as linear data</text><text x="80" y="542" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Turn off sRGB. Check channel packing and compression.</text><text x="80" y="573" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Keep the original R/B/A when editing the G eye mask.</text><rect x="745" y="469" width="635" height="145" rx="15" fill="#F7FAFD" stroke="#C7D4E3" stroke-width="2"/><rect x="745" y="481" width="5" height="121" rx="2" fill="#297643"/><text x="765" y="506" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#297643">5  Validate in the preview</text><text x="765" y="542" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Sweep the light and compare fixed camera pairs.</text><text x="765" y="573" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4A5D72">Inspect seams, concave pockets, distant mips and eye AO.</text><polyline points="1192,376 1192,420 377,420 377,469" stroke="#566B82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 695 539 L 745 539" stroke="#566B82" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="60" y="667" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#4A5D72">Authoring reference. Regional mask values and LUT texel coordinates have separate roles.</text></svg>